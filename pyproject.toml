[project]
name = "AutoEnvAgentRL"
version = "0.1.0"
description = "Automatically generate certified business sandboxes and train tool-using agents with SFT and RL"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "马强", email = "maqiangcsu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
# Optional: sample generation domains from a Neo4j business knowledge graph (production/domains.py).
graph = [
    "neo4j>=6.0.0",
]

rl = [
    "mlx-lm>=0.31,<0.33",
    "numpy>=2.0",
    "tensorboard>=2.20,<3",
    "psutil>=7,<8",
]

cuda-export = [
    "torch>=2.9,<3",
    "transformers>=4.51,<6",
    "peft>=0.17,<1",
    "safetensors>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = ["env_factory", "env_factory_v3", "rl"]
