[project]
name = "AutoEnvAgentRL"
version = "0.1.0"
description = "Generate contract-driven Agentic RL tasks and executable sandboxes"
readme = "README.md"
authors = [
    { name = "马强", email = "maqiangcsu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ijson>=3.4.0",
    "neo4j>=6.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
rl = [
    "mlx-lm>=0.31,<0.33",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = ["env_factory", "rl"]
